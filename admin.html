<!DOCTYPE html>
<html>

<head>

<title>Admin MCU Stream</title>

<style>

body{
background:#0b0b0b;
color:white;
font-family:Arial;
padding:30px;
max-width:900px;
margin:auto;
}

h1{
color:#e50914;
}

.card{
background:#171717;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

input,select,textarea,button{

width:100%;
padding:12px;
margin:8px 0;

background:#222;
color:white;

border:1px solid #444;
border-radius:8px;

}

button{

background:#e50914;
border:none;
font-weight:bold;
cursor:pointer;

}

.delete{
background:#555;
}

.hidden{
display:none;
}

.film{

background:#222;
padding:15px;
margin:10px 0;
border-radius:10px;

}

img{

width:100px;
border-radius:8px;

}

</style>

</head>


<body>


<div id="login" class="card">

<h1>🔐 Admin</h1>

<input id="password" type="password" placeholder="Mot de passe">

<button onclick="connexion()">
Connexion
</button>

</div>




<div id="panel" class="hidden">


<h1>🎬 Panel Admin</h1>


<div class="card">


<h2>Ajouter un film</h2>


<input id="titre" placeholder="Nom du film">


<input id="annee" placeholder="Année">


<input id="terre" placeholder="Univers / Terre">


<select id="type">

<option>Film</option>
<option>Série</option>

</select>


<input id="poster" placeholder="URL Poster">


<input id="lien" placeholder="Lien streaming">


<textarea id="note" placeholder="Note"></textarea>



<button onclick="ajouterFilm()">

➕ Ajouter le film

</button>


</div>



<div class="card">

<h2>📚 Films</h2>

<div id="liste"></div>

</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://fdycxfjaljuuaqdwmcuu.supabase.co";


const SUPABASE_KEY =
"sb_publishable_M0moUWVLW2HHW70XfcCJbg_JeFvy4Kr";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// MOT DE PASSE ADMIN

const ADMIN_PASSWORD="67";




function connexion(){


let pass =
document.getElementById("password").value;


if(pass === ADMIN_PASSWORD){


document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";


chargerFilms();


}else{


alert("Mot de passe incorrect");


}


}






async function ajouterFilm(){



let film={


title:
document.getElementById("titre").value,


year:
Number(document.getElementById("annee").value),


earth:
document.getElementById("terre").value,


type:
document.getElementById("type").value,


poster:
document.getElementById("poster").value,


url:
document.getElementById("lien").value,


note:
document.getElementById("note").value


};




const {error}=await supabaseClient

.from("films")

.insert([film]);




if(error){


alert(error.message);


}else{


alert("Film ajouté !");


chargerFilms();


}


}







async function chargerFilms(){



const {data,error}=await supabaseClient

.from("films")

.select("*")

.order("id",{ascending:false});




if(error){

alert(error.message);

return;

}




document.getElementById("liste").innerHTML="";




data.forEach(film=>{


document.getElementById("liste").innerHTML += `


<div class="film">


<img src="${film.poster}">


<h3>${film.title}</h3>


Année : ${film.year}<br>

Type : ${film.type}<br>

Univers : ${film.earth}<br>

Note : ${film.note}



<button class="delete"
onclick="supprimerFilm(${film.id})">

🗑 Supprimer

</button>


</div>


`;



});


}







async function supprimerFilm(id){



if(confirm("Supprimer ce film ?")){


const {error}=await supabaseClient

.from("films")

.delete()

.eq("id",id);



if(error){

alert(error.message);

}else{

alert("Film supprimé !");

chargerFilms();

}


}


}



</script>


</body>

</html>
