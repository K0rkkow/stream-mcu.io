<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCH'VERSE — MCU Chronologique</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230b0b12' width='100' height='100'/><text x='50' y='75' font-size='70' font-weight='bold' fill='%23e62429' text-anchor='middle' font-family='Orbitron'>⚡</text></svg>">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
</head>
<body>
<div class="spider-web top-left"></div>
<div class="spider-web top-right"></div>
<!-- HEADER -->
<header>
<div class="mjolnir">⚡</div>
<div class="logo">ARCH'VERSE</div>
<div class="logo-sub">⏣ MCU Chronologique ⏣</div>
<div class="creator">k0rkoww × heiwa'stream</div>
<p class="bio">
Explorez l'univers cinématographique Marvel <span class="arc-dot"></span><br>
Films & séries en ordre chronologique, prêts à regarder.
</p>
<div class="header-stars">
<span>✦</span><span>★</span><span>✦</span><span>★</span><span>✦</span>
</div>
</header>
<!-- DISCORD -->
<div class="discord-section">
<a href="https://discord.gg/FcSMrZezJ" target="_blank" class="discord-btn">
<span class="discord-icon">🎧</span>
Rejoindre le Discord HeiwaStream
</a>
</div>
<!-- FILTERS -->
<div class="filters">
<button class="filter-btn active" data-filter="all">✦ Tout</button>
<button class="filter-btn" data-filter="movie">▸ Films</button>
<button class="filter-btn" data-filter="series">▸ Séries</button>
</div>
<!-- GRID -->
<div class="grid" id="grid"></div>
<!-- MODAL SÉRIE -->
<div class="modal" id="modal">
<div class="modal-content">
<button class="close-btn" id="closeModal">×</button>
<h2 id="modalTitle"></h2>
<div class="episodes" id="episodesList"></div>
</div>
</div>
<footer>
<p>ARCH'VERSE <span class="footer-spidey">🕷</span> by k0rkoww × heiwa'stream <span class="footer-spidey">🕸</span></p>
</footer>
<script src="script.js"></script>
</body>
</html>
